<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>headless-three browser reference corpus</title>
    <script type="importmap">
      {
        "imports": {
          "three": "../../node_modules/three/build/three.module.js",
          "three/addons/": "../../node_modules/three/examples/jsm/"
        }
      }
    </script>
    <style>
      :root {
        color-scheme: dark;
        font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #14161a;
        color: #f4f6f8;
      }

      body {
        margin: 0;
        padding: 24px;
      }

      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        margin-bottom: 20px;
      }

      .actions {
        display: flex;
        gap: 10px;
      }

      h1 {
        margin: 0;
        font-size: 20px;
        font-weight: 650;
      }

      button,
      a {
        border: 1px solid #5c6572;
        border-radius: 6px;
        color: #f4f6f8;
        background: #20252d;
        cursor: pointer;
        font: inherit;
        padding: 8px 10px;
        text-decoration: none;
      }

      button:hover,
      a:hover {
        background: #2c333d;
      }

      a[aria-disabled="true"] {
        cursor: not-allowed;
        opacity: 0.5;
        pointer-events: none;
      }

      #status {
        color: #aab4c0;
        margin-bottom: 16px;
      }

      #fixtures {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
        gap: 14px;
      }

      .fixture {
        border: 1px solid #333a45;
        border-radius: 8px;
        background: #1b1f26;
        padding: 12px;
      }

      .fixture img {
        display: block;
        width: 100%;
        image-rendering: pixelated;
        background: #08090b;
        border-radius: 4px;
      }

      .fixture strong {
        display: block;
        margin: 10px 0;
        overflow-wrap: anywhere;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Browser Reference Corpus</h1>
      <div class="actions">
        <a id="download-manifest" href="#" aria-disabled="true">Download Manifest</a>
        <button id="download-all" type="button" disabled>Download All</button>
      </div>
    </header>
    <div id="status">Rendering corpus with THREE.WebGLRenderer...</div>
    <main id="fixtures"></main>
    <script type="module" src="./generate.mjs"></script>
  </body>
</html>
